# MangoHud: Aktivieren + Logging-Optionen erzwingen
#
# MANGOHUD=1 fehlt in der Gamescope-Session: gamescope-session-plus liest NUR
# /etc/environment.d/*.conf und ~/.config/environment.d/*.conf, NICHT /etc/environment.
# → Vulkan-Layer lädt ohne diesen Eintrag nicht in Game-Prozessen.
#
# MANGOHUD_CONFIG hat höhere Priorität als MANGOHUD_CONFIGFILE UND wird laut
# MangoHud-Quellcode (overlay_params.cpp, parse_overlay_config) am Ende IMMER
# nochmal komplett neu angewendet, überschreibt also jeden Key aus der
# Configfile bei Konflikt (bestätigt per isoliertem vkcube-Test, 2026-07-30).
# `read_cfg=1` ist zwingend nötig, sonst wird MANGOHUD_CONFIGFILE
# (Steams eigene, dynamisch generierte Datei bzw. der Daemon-Patch darauf)
# komplett übersprungen: `if (!env || read_cfg) parseConfigFile(...)`.
#
# WICHTIG: `no_display` darf HIER NICHT gesetzt werden — der Daemon
# (bc250_daemon.py, _ensure_mangohud_patch) steuert no_display/alpha pro
# Spiel selbst über die Configfile (Deadlock-Fix bei Steam-Overlay "Aus",
# siehe ~/Dokumente/hud/MANGOHUD_DEBUG.md). Stünde no_display hier in
# MANGOHUD_CONFIG, würde es beim finalen Env-Reapply den Daemon-Patch
# (no_display=0) immer wieder auf 1 zurückkippen → Deadlock bleibt für immer
# aktiv, 0 CSVs, unabhängig davon was der Daemon in die Configfile schreibt.
MANGOHUD=1
MANGOHUD_CONFIG=autostart_log=1,log_duration=0,fps_sampling_period=100,output_folder=__OUTPUT_FOLDER__,read_cfg=1
